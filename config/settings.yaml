# All tunable numbers live here. Change these, not the code.

judge: heuristic          # heuristic (free, offline) | jev (once you have a key)

salary:
  new_entrant_floor_gbp: 33400   # Skilled Worker new-entrant minimum (2026). Verify on gov.uk if rules change.

gates:                    # drop if probability crosses these
  no_sponsorship_wording_max: 0.8
  requires_clearance_max: 0.8
  requires_a_level_maths_max: 0.8
  accepts_sept_2027_finish_min: 0.2
  max_2_years_experience_min: 0.2
  uk_based_min: 0.2

strong:                   # all must hold for the Strong bucket
  offers_sponsorship_min: 0.7      # OR company is on the Home Office sponsor register
  profile_match_min: 4

role_rank:                # higher = shown first. Order agreed 2 Oct 2026.
  swe_ai_ml: 6
  product_management: 5
  tech_consulting: 4
  quant_dev: 3
  data_science: 2
  tech_risk: 1
  other: 0

sources:                  # turn whole sources on/off
  gmail_alerts: true      # core: all job-board alert emails (see alert_senders)
  ats: true               # company boards in companies.yaml (full descriptions)
  adzuna: false           # off: too much non-grad noise
  reed: false             # off: too much non-grad noise
  simplify_newgrad: false # off: mostly US roles

# Alert emails land in the Gmail label `job-alerts`. Each sender is matched on
# its From address. `match` values are best guesses: after the first real alert
# from each site, check the From address and fix the match if needed.
# tier main = your core boards. A main board with 0 jobs gets flagged in the digest.
alert_senders:
  - {name: linkedin,       match: linkedin.com,            parser: linkedin, tier: main}
  - {name: indeed,         match: indeed.com,              parser: indeed,   tier: main}
  - {name: student_circus, match: studentcircus.com,       parser: generic,  tier: main}
  - {name: milkround,      match: milkround.com,           parser: generic,  tier: main}
  - {name: bristol_mycareer, match: bristol.ac.uk,         parser: generic,  tier: main}
  - {name: bright_network, match: brightnetwork.co.uk,     parser: generic,  tier: extra}
  - {name: prospects,      match: prospects.ac.uk,         parser: generic,  tier: extra}
  - {name: targetjobs,     match: targetjobs.co.uk,        parser: generic,  tier: extra}
  - {name: otta,           match: welcometothejungle.com,  parser: generic,  tier: extra}

# Boards with no usable alert email go here and show as a reminder in the digest.
# Move a board from here into alert_senders once you find an alert option on it.
manual_check:
  - {name: The Trackr, url: "https://www.the-trackr.com", note: "grad scheme opening dates"}

search_terms:             # used by Adzuna / Reed (only if switched on)
  - graduate software engineer
  - junior software engineer
  - machine learning engineer graduate
  - AI engineer graduate
  - associate product manager
  - graduate product manager
  - graduate technology consultant
  - graduate quantitative developer
  - graduate data scientist
  - graduate technology risk

email:
  subject_prefix: "[Job Scanner]"  # separate from the weekly grad-scheme check
  # Paste your Streamlit app link here once deployed. Empty = full report by email.
  dashboard_url: ""
