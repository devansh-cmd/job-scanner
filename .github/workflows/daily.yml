name: daily-job-scan

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 UK summer, 06:00 UK winter
  workflow_dispatch:       # "Run workflow" button for manual runs
    inputs:
      rejudge:
        description: "Re-judge all current jobs (after changing rules or the judge)"
        type: boolean
        default: false

permissions:
  contents: write          # to commit data/jobs.db back

concurrency: job-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore sponsor register cache
        uses: actions/cache@v4
        with:
          path: data/sponsors.csv
          key: sponsors-${{ github.run_id }}
          restore-keys: sponsors-

      - name: Run pipeline
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m jobscan.main ${{ inputs.rejudge && '--rejudge' || '' }}

      - name: Keep today's digest (downloadable from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: out/*.html
          if-no-files-found: ignore

      - name: Save seen-jobs state
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.db
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git push
